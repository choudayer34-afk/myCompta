<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compta</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Compta">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Compta</h1>
    <div>
      <span id="reseau" class="etat"></span>
      <button id="btn-sortie" class="sec cache">Déconnexion</button>
    </div>
  </header>

  <main>
    <section id="ecran-connexion" class="carte">
      <h2>Connexion</h2>
      <form id="form-connexion">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" autocomplete="username" required>
        <label for="mdp">Mot de passe</label>
        <input id="mdp" type="password" autocomplete="current-password" required>
        <p id="erreur" class="erreur"></p>
        <button type="submit">Se connecter</button>
      </form>
    </section>

    <section id="ecran-app" class="carte cache">
      <h2>Test de synchronisation</h2>
      <p class="etat">Ajoutez des lignes, coupez le réseau (mode avion), ajoutez-en d'autres, puis rétablissez le réseau.</p>
      <form id="form-test">
        <label for="libelle">Libellé</label>
        <input id="libelle" type="text" required>
        <button type="submit">Ajouter</button>
      </form>
      <ul id="liste"></ul>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
