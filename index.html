<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compta</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Compta">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Compta <button id="version" type="button" class="version" aria-label="Version de l'application" title="Toucher pour rechercher une mise à jour"></button></h1>
    <div>
      <span id="reseau" class="etat"></span>
      <button id="btn-aide" class="sec cache" aria-label="Aide sur cet écran" title="Aide sur cet écran">?</button>
      <button id="btn-voix" class="sec cache" aria-label="Dépense à l'oral" title="Dépense à l'oral">🎤</button>
      <button id="btn-recherche" class="sec cache" aria-label="Recherche" title="Recherche">🔍</button>
      <button id="btn-ticket" class="sec cache" aria-label="Scanner un ticket" title="Scanner un ticket">📷</button>
      <button id="btn-depense" class="sec cache" aria-label="Nouvelle dépense">+ Dépense</button>
      <button id="btn-sortie" class="sec cache">Déconnexion</button>
    </div>
  </header>

  <main>
    <section id="ecran-connexion" class="carte">
      <h2>Connexion</h2>
      <form id="form-connexion">
        <div class="champ">
          <label for="email">Adresse e-mail</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="champ">
          <label for="mdp">Mot de passe</label>
          <input id="mdp" type="password" autocomplete="current-password" required>
        </div>
        <p id="erreur" class="erreur"></p>
        <button type="submit">Se connecter</button>
      </form>
    </section>

    <section id="ecran-app" class="cache">
      <div id="bandeau-pointage" class="rappel rappel-budget cache"></div>
      <div id="bandeau-budget" class="rappel rappel-budget cache"></div>
      <div id="principal"></div>
    </section>
  </main>

  <nav id="nav" class="cache">
    <a href="#/comptes" data-onglet="comptes" class="actif" aria-label="Comptes"><span class="ico">🏦</span><span class="lib">Comptes</span></a>
    <a href="#/budgets" data-onglet="budgets" aria-label="Budgets"><span class="ico">🎯</span><span class="lib">Budgets</span></a>
    <a href="#/previsions" data-onglet="previsions" aria-label="Projection"><span class="ico">📈</span><span class="lib">Projection</span></a>
    <a href="#/releve" data-onglet="releve" aria-label="Relevé bancaire"><span class="ico">📄</span><span class="lib">Relevé</span></a>
    <a href="#/plus" data-onglet="plus" aria-label="Plus"><span class="ico">⋯</span><span class="lib">Plus</span></a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
