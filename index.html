<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Compta</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Compta">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Compta</h1>
    <div>
      <span id="reseau" class="etat"></span>
      <button id="btn-voix" class="sec cache" aria-label="Dépense à l'oral" title="Dépense à l'oral">🎤</button>
      <button id="btn-ticket" class="sec cache" aria-label="Scanner un ticket" title="Scanner un ticket">📷</button>
      <button id="btn-depense" class="sec cache" aria-label="Nouvelle dépense">+ Dépense</button>
      <button id="btn-sortie" class="sec cache">Déconnexion</button>
    </div>
  </header>

  <main>
    <section id="ecran-connexion" class="carte">
      <h2>Connexion</h2>
      <form id="form-connexion">
        <div class="champ">
          <label for="email">Adresse e-mail</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="champ">
          <label for="mdp">Mot de passe</label>
          <input id="mdp" type="password" autocomplete="current-password" required>
        </div>
        <p id="erreur" class="erreur"></p>
        <button type="submit">Se connecter</button>
      </form>
    </section>

    <section id="ecran-app" class="cache">
      <div id="principal"></div>
    </section>
  </main>

  <nav id="nav" class="cache">
    <a href="#/comptes" data-onglet="comptes" class="actif">Comptes</a>
    <a href="#/categories" data-onglet="categories">Catégories</a>
    <a href="#/echeancier" data-onglet="echeancier">Échéancier</a>
    <a href="#/import" data-onglet="import">Import</a>
    <a href="#/export" data-onglet="export">Export</a>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
